<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SICODE</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        .recovery-box {
            margin: 20px 0;
            padding: 16px;
            background: #f0f9ff;
            border: 1.5px dashed #0ea5e9;
            border-radius: 16px;
            text-align: left;
            animation: fadeInDown 0.5s;
        }

        .recovery-link {
            display: block;
            margin-top: 10px;
            padding: 12px;
            background: white;
            border: 1px solid #bae6fd;
            border-radius: 10px;
            color: var(--primary-blue);
            font-weight: 700;
            text-decoration: none;
            word-break: break-all;
            font-size: 12px;
            transition: 0.2s;
        }

        .recovery-link:hover {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 12px rgba(0, 102, 179, 0.1);
        }

        .login-header {
            margin-bottom: 30px;
            margin-top: 20px;
            text-align: center;
        }

        .login-title {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-gray);
            margin: 0;
        }

        .back-link-wrapper {
            margin-top: 25px;
            text-align: center;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            font-size: 13px;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--primary-blue);
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card animate__animated animate__fadeIn">
        <div class="login-floating-icon">
            <i class="fa-solid fa-key"></i>
        </div>

        <div class="login-header">
            <h1 class="login-title">Recuperar Acceso</h1>
            <p class="login-subtitle">Ingresa tu correo para obtener el enlace.</p>
        </div>

        {% if test_link %}
        <div class="recovery-box">
            <div style="display: flex; align-items: center; gap: 8px; color: #0369a1; font-weight: 700; font-size: 13px;">
                <i class="fa-solid fa-circle-info"></i> Enlace Generado:
            </div>
            <a href="{{ test_link }}" class="recovery-link">
                {{ test_link }}
            </a>
            <div style="margin-top: 8px; font-size: 11px; color: #0ea5e9; font-style: italic; text-align: center;">
                Haz clic arriba para cambiar tu contraseña ahora mismo.
            </div>
        </div>
        {% endif %}

        <form action="/forgot-password" method="POST">
            <label class="login-label">Correo Electrónico</label>
            <div class="login-input-group">
                <i class="fa-solid fa-envelope login-input-icon"></i>
                <input aria-label="ejemplo@sunat.gob.pe" type="email" class="login-input" name="email" placeholder="ejemplo@sunat.gob.pe" required>
            </div>

            <button type="submit" class="login-btn">
                Obtener Enlace
            </button>
        </form>

        <div class="back-link-wrapper">
            <a href="/login" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Volver al Inicio de Sesión
            </a>
        </div>
    </div>
</body>
</html>
