<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - SICODE</title>
    
    <!-- Fuentes Google -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    
    <style>
        .login-header {
            margin-bottom: 30px;
            margin-top: 20px;
            text-align: center;
        }

        .login-title {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
            margin: 0 0 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-gray);
            margin: 0;
        }

        .user-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-top: 15px;
        }

        .btn-toggle-eye {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
            z-index: 10;
        }

        .btn-toggle-eye:hover {
            color: var(--primary-blue);
        }

        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card animate__animated animate__fadeInUp">
        <div class="login-floating-icon">
            <i class="fa-solid fa-lock-open"></i>
        </div>

        <div class="login-header">
            <h2 class="login-title">Nueva Contraseña</h2>
            <p class="login-subtitle">Configura tu nuevo acceso.</p>
            <div class="user-pill">
                <i class="fa-solid fa-circle-user"></i> {{ username }}
            </div>
        </div>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/reset-password" method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            
            <label class="login-label">Nueva Contraseña</label>
            <div class="login-input-group">
                <i class="fa-solid fa-key login-input-icon"></i>
                <input aria-label="Mínimo 6 caracteres" type="password" name="password" id="password" class="login-input" required minlength="6" placeholder="Mínimo 6 caracteres">
                <button type="button" class="btn-toggle-eye" onclick="togglePass('password', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <label class="login-label">Confirmar Contraseña</label>
            <div class="login-input-group">
                <i class="fa-solid fa-shield-halved login-input-icon"></i>
                <input aria-label="Repite tu contraseña" type="password" name="confirm_password" id="confirm_password" class="login-input" required placeholder="Repite tu contraseña">
                <button type="button" class="btn-toggle-eye" onclick="togglePass('confirm_password', this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="login-btn">
                Actualizar Acceso
            </button>
        </form>
    </div>

    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
